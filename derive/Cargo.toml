[package]
name = "co3-derive"

version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

description = "Derive macros for `CO3`"
repository = "https://github.com/mversic/co3/derive"

[lib]
proc-macro = true

[features]
alloc = []

[dependencies]
syn = { version = "2.0.114", features = ["full", "extra-traits", "visit", "visit-mut"] }
proc-macro-crate = "3.4.0"
proc-macro2 = "1.0.105"
# TODO: bump to 0.12.0 asap
manyhow = "0.11.4"
quote = "1.0.43"
