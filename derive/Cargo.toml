[package]
name = "co3-derive"

version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

description = "Derive macros for `CO3`"
repository = "https://github.com/mversic/co3/derive"

[lib]
proc-macro = true

[dependencies]
syn = { version = "2.0.114", features = ["full", "extra-traits", "visit", "visit-mut"] }
manyhow = "0.11.4"
proc-macro2 = "1.0.105"
proc-macro-crate = "3.4.0"
quote = "1.0.43"

[dev-dependencies]
co3 = { path = "..", features = ["derive"] }

static_assertions = "1.1.0"
trybuild = "1.0.114"
impls = "1.0.3"
