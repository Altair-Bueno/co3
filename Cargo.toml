[package]
name = "co3"

version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
authors = ["Marin Veršić <marin.versic101@gmail.com>"]
repository = "https://github.com/mversic/co3"
description = "Build C API from Rust"
keywords = ["FFI", "foreign", "dynamic", "linking", "ABI"]

categories = ["development-tools::ffi"]

[features]
default = ["alloc"]

# Enables:
# - deriving C-compatible representations with `#[derive(ReprC)]`
# - writing exports/extern FFI declarations via `ffi!`
derive = ["co3-derive", "co3-types/derive"]

# Implements conversion traits for types from the `alloc` crate (e.g. `Box<T>` or `Vec<T>`).
alloc = ["co3-types/alloc"]

# Enables [allocator API](https://github.com/rust-lang/rust/issues/32838)
allocator-api = ["alloc"]

[dependencies]
co3-derive = { path = "derive", optional = true }
co3-types = { path = "co3-types", default-features = false }

# TODO: Should this get removed, it is not widely used
derive_more = { version = "2.1.1", features = ["display"] }
disjoint_impls = { path = "../disjoint_impls/" }
#disjoint_impls = "1.3.8"
impls = "1.0.3"

[dev-dependencies]
static_assertions = "1.1.0"

[workspace]
resolver = "2"
members = ["derive", "co3-types", "co3-types/derive"]

[[test]]
name = "abi"
required-features = ["alloc", "derive"]

[[test]]
name = "export"
required-features = ["alloc", "derive"]

[[test]]
name = "import"
required-features = ["alloc", "derive"]
